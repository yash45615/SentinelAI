name: SentinelAI Reliability Gate

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  reliability:
    name: Reliability Checks
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sentinelai
          POSTGRES_PASSWORD: sentinelai
          POSTGRES_DB: sentinelai_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U sentinelai -d sentinelai_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Create CI environment
        shell: bash
        run: |
          cat > .env <<'EOF'
          APP_ENV=development
          DATABASE_URL=postgresql+psycopg2://sentinelai:sentinelai@localhost:5432/sentinelai_db
          CORS_ORIGINS=http://localhost:5173
          AI_RCA_ENABLED=false
          AI_RCA_PROVIDER=openai
          AI_RCA_MODEL=gpt-4.1-mini
          AI_RCA_API_KEY=
          AI_RCA_TIMEOUT_SECONDS=30
          SECURITY_ENABLED=false
          ADMIN_API_KEY=ci-test-secret
          RATE_LIMIT_ENABLED=false
          RATE_LIMIT_REQUESTS=120
          RATE_LIMIT_WINDOW_SECONDS=60
          DOCS_ENABLED=true
          EOF

      - name: Wait for PostgreSQL
        shell: bash
        run: |
          python - <<'PY'
          import socket
          import time

          host = "127.0.0.1"
          port = 5432

          for _ in range(30):
              try:
                  with socket.create_connection((host, port), timeout=1):
                      print("PostgreSQL is ready.")
                      break
              except OSError:
                  time.sleep(1)
          else:
              raise SystemExit("PostgreSQL did not become ready.")
          PY

      - name: Initialize database
        run: |
          python -c "from app.db.database import Base, engine; import app.db.models; Base.metadata.create_all(bind=engine); print('CI database initialized.')"

      - name: Validate project imports
        run: |
          python -c "import app.main; print('SentinelAI import check passed.')"

      - name: Run reliability tests
        run: |
          pytest -q tests/unit/test_rca_engine.py
          pytest -q tests/unit/test_recovery_verifier.py
          pytest -q tests/unit/test_chaos_engine.py
          pytest -q tests/unit/test_slo_engine.py
          pytest -q tests/unit/test_load_test_engine.py
          pytest -q tests/unit/test_security.py
          pytest -q tests/unit/test_security_middleware.py

      - name: Reliability gate passed
        run: |
          echo "SentinelAI reliability gate PASSED."